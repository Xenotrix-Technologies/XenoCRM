{% extends 'base.html' %}

{% block title %}XenoCRM | Record New Income{% endblock %}

{% block content %}
<div class="p-margin-edge flex-1 flex flex-col bg-surface-container-low overflow-y-auto custom-scrollbar">
    
    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
        <a href="{% url 'finance_income' %}" class="w-10 h-10 rounded-full bg-surface-variant text-on-surface flex items-center justify-center hover:bg-surface-variant/80 transition-colors shadow-sm">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <h2 class="font-headline-sm text-headline-sm font-bold uppercase tracking-wider text-primary">Record New Income</h2>
    </div>

    <!-- Form Container -->
    <div class="glass-card p-8 rounded-2xl shadow-sm border border-outline-variant/30 bg-surface text-on-surface max-w-4xl mx-auto w-full">
        <form method="POST" action="{% url 'finance_add_income' %}" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Transaction Date -->
                <div>
                    <label class="block text-label-sm font-bold text-on-surface-variant mb-2">Transaction Date</label>
                    <div class="relative">
                        <input type="date" name="date" required
                            class="w-full bg-surface-container-highest border border-outline-variant/50 rounded-lg px-4 py-2.5 text-body-md focus:ring-2 focus:ring-primary focus:border-primary text-on-surface appearance-none">
                    </div>
                </div>

                <!-- Client -->
                <div>
                    <label class="block text-label-sm font-bold text-on-surface-variant mb-2">Client Business / Org Name (Optional)</label>
                    <select name="client_name" class="w-full bg-surface-container-highest border border-outline-variant/50 rounded-lg px-4 py-2.5 text-body-md focus:ring-2 focus:ring-primary focus:border-primary text-on-surface appearance-none">
                        <option value="No Client / General">No Client / General</option>
                        {% for client in clients %}
                        <option value="{{ client }}">{{ client }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Project / Description -->
            <div>
                <label class="block text-label-sm font-bold text-on-surface-variant mb-2">Project / Description</label>
                <input type="text" name="project_name" placeholder="e.g. Milestone 1 Payment" required
                    class="w-full bg-surface-container-highest border border-outline-variant/50 rounded-lg px-4 py-2.5 text-body-md focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder-on-surface-variant/50">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Amount Received -->
                <div>
                    <label class="block text-label-sm font-bold text-on-surface-variant mb-2">Amount Received (₹)</label>
                    <input type="number" step="0.01" name="amount" placeholder="0.00" required
                        class="w-full bg-surface-container-highest border border-outline-variant/50 rounded-lg px-4 py-2.5 text-body-md focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder-on-surface-variant/50 font-bold text-primary">
                </div>

                <!-- Payment Method -->
                <div>
                    <label class="block text-label-sm font-bold text-on-surface-variant mb-2">Payment Method</label>
                    <select name="payment_method" required class="w-full bg-surface-container-highest border border-outline-variant/50 rounded-lg px-4 py-2.5 text-body-md focus:ring-2 focus:ring-primary focus:border-primary text-on-surface appearance-none">
                        {% for method in payment_methods %}
                        <option value="{{ method.id }}">{{ method.name }}</option>
                        {% empty %}
                        <option value="">No payment methods available (Configure in Settings)</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-4">
                <button type="submit" class="px-6 py-3 bg-[#1ca454] text-white font-bold rounded-lg hover:bg-[#158f48] transition-all shadow-sm">
                    Save Income Entry
                </button>
            </div>
            
        </form>
    </div>

</div>
{% endblock %}
