{% extends 'base.html' %}

{% block title %}XenoCRM | Reset Password{% endblock %}

{% block auth_content %}
<div class="min-h-screen bg-background flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <!-- Visual background blobs -->
    <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-tertiary-container/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md glass-card rounded-2xl p-8 border border-white/40 shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <h1 class="font-headline-lg text-[32px] font-bold text-primary leading-tight">Reset Password</h1>
            <p class="text-sm text-secondary mt-2">Enter your email address to receive a password reset link.</p>
        </div>

        {% if form.errors %}
            <div class="mb-4 space-y-2">
                <div class="p-3 text-sm rounded-lg bg-error-container text-on-error-container">
                    Please correct the errors below.
                </div>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-label-md font-label-md text-outline uppercase mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="Enter your email" class="w-full bg-white/60 border border-outline-variant rounded-xl px-4 py-3 text-body-sm focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white transition-all"/>
                </div>
            </div>

            <div class="mt-8 mb-4">
                <button type="submit" class="w-full py-3 bg-primary text-on-primary font-button rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-all">
                    Send Reset Link
                </button>
            </div>
            
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-body-sm text-primary font-semibold hover:underline">Back to Sign In</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
