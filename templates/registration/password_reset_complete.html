{% extends 'base.html' %}

{% block title %}XenoCRM | Password Reset Complete{% endblock %}

{% block auth_content %}
<div class="min-h-screen bg-background flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <!-- Visual background blobs -->
    <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-tertiary-container/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md glass-card rounded-2xl p-8 border border-white/40 shadow-2xl relative z-10">
        <div class="text-center mb-6">
            <h1 class="font-headline-lg text-[32px] font-bold text-primary leading-tight">Password Reset Complete</h1>
            <p class="text-sm text-secondary mt-4 leading-relaxed">
                Your password has been set. You may go ahead and log in now.
            </p>
        </div>

        <div class="mt-8 text-center">
            <a href="{% url 'login' %}" class="w-full block py-3 bg-primary text-on-primary font-button rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-all">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
